apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-{{ .Chart.Name }}
    appVersion: {{ .Chart.AppVersion }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas | default 1 }}
  {{- end }}
  minReadySeconds: 15
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-{{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Chart.Name }}-pod
        app.kubernetes.io/name: {{ .Release.Name }}-{{ .Chart.Name }}
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: {{ .Values.serviceAccountName }}
      {{- if .Values.securityContext }}
      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        runAsNonRoot: true
      {{- end }}
      containers:
        - name: {{ .Release.Name }}-{{ .Chart.Name }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: {{ required "image repository must be provided." .Values.image.repository }}:{{ .Chart.AppVersion }}
          imagePullPolicy: IfNotPresent
          {{- if .Values.command }}
          command: [ '{{ .Values.command }}' ]
          {{- end }}
          {{- if .Values.resources }}
          resources:
            {{- if .Values.resources.limits }}
            limits:
              {{- if .Values.resources.limits.memory }}
              memory: {{ .Values.resources.limits.memory }}
              {{- end }}
              {{- if .Values.resources.limits.cpu }}
              cpu: {{ .Values.resources.limits.cpu }}
              {{- end }}
            {{- end }}
            {{- if .Values.resources.requests }}
            requests:
              {{- if .Values.resources.requests.memory }}
              memory: {{ .Values.resources.requests.memory }}
              {{- end }}
              {{- if .Values.resources.requests.cpu }}
              cpu: {{ .Values.resources.requests.cpu }}
              {{- end }}
            {{- end }}
          {{- end }}
          ports:
            {{- if .Values.ports }}
            - containerPort: {{ .Values.ports.targetPort }}
            {{- end }}
          {{- if .Values.probe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ ((.Values.probe).liveness).endpoint | default "/actuator/health/liveness" | quote }}
              {{- if ((.Values.management).port) }}
              port: {{ .Values.management.port }}
              {{- end }}
            timeoutSeconds: {{ ((.Values.probe).liveness).timeoutSeconds | default 1 }}
            failureThreshold: {{ ((.Values.probe).liveness).failureThreshold | default 4 }}
            successThreshold: {{ ((.Values.probe).liveness).successThreshold | default 1 }}
            periodSeconds: {{ ((.Values.probe).liveness).periodSeconds | default 10 }}
            initialDelaySeconds: {{ ((.Values.probe).liveness).initialDelaySeconds | default 10 }}
          readinessProbe:
            httpGet:
              path: {{ ((.Values.probe).readiness).endpoint | default "/actuator/health/readiness" | quote }}
              {{- if ((.Values.management).port) }}
              port: {{ .Values.management.port }}
              {{- end }}
            timeoutSeconds: {{ ((.Values.probe).readiness).timeoutSeconds | default 1 }}
            failureThreshold: {{ ((.Values.probe).readiness).failureThreshold | default 2 }}
            successThreshold: {{ ((.Values.probe).readiness).successThreshold | default 1 }}
            periodSeconds: {{ ((.Values.probe).readiness).periodSeconds | default 5 }}
            initialDelaySeconds: {{ ((.Values.probe).readiness).initialDelaySeconds | default 10 }}
          startupProbe:
            httpGet:
              path: {{ ((.Values.probe).startup).endpoint | default "/actuator/health/liveness" | quote }}
              {{- if ((.Values.management).port) }}
              port: {{ .Values.management.port }}
              {{- end }}
            timeoutSeconds: {{ ((.Values.probe).startup).timeoutSeconds | default 1 }}
            failureThreshold: {{ ((.Values.probe).startup).failureThreshold | default 30 }}
            periodSeconds: {{ (((.Values.probe).startup).periodSeconds) | default 5 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    set +e
                    PORT="{{ ((.Values.management).port) | default 8081 }}"
                    DRAIN_TIMEOUT_SECONDS="{{ (((.Values.probe).preStop).drainTimeoutSeconds) | default 45 }}"
                    POLL_INTERVAL_SECONDS="{{ (((.Values.probe).preStop).pollIntervalSeconds) | default 2 }}"
                    REQUEST_TIMEOUT_SECONDS="{{ (((.Values.probe).preStop).requestTimeoutSeconds) | default 5 }}"
                    MAINTENANCE_URL="http://localhost:${PORT}/actuator/maintenance"
                    START_TIME=$(date +%s)

                    # Tell the pod to stop listening to SQS. This call is asynchronous server-side
                    # and returns immediately; it does not wait for in-flight processing to finish.
                    # Bounded by REQUEST_TIMEOUT_SECONDS so a wedged app can't stall this hook.
                    wget -q -T "$REQUEST_TIMEOUT_SECONDS" -O - --post-data='' "$MAINTENANCE_URL"

                    # Poll until listener polling has actually stopped and in-flight processing
                    # and acknowledgement has drained to zero, bounded by DRAIN_TIMEOUT_SECONDS so
                    # this hook never blocks termination beyond the configured budget. Elapsed time
                    # is real wall-clock time (covering both the initial POST above and every GET
                    # below), not just the sum of sleeps, so a slow/hung request still counts
                    # against the budget rather than silently extending it.
                    while true; do
                      now=$(date +%s)
                      elapsed=$((now - START_TIME))
                      if [ "$elapsed" -ge "$DRAIN_TIMEOUT_SECONDS" ]; then
                        break
                      fi
                      status="$(wget -q -T "$REQUEST_TIMEOUT_SECONDS" -O - "$MAINTENANCE_URL")"
                      running="$(echo "$status" | grep -o '"listenersRunning":[a-z]*' | cut -d: -f2)"
                      inflight="$(echo "$status" | grep -o '"inFlightCount":[0-9]*' | cut -d: -f2)"
                      if [ "$running" = "false" ] && [ "$inflight" = "0" ]; then
                        exit 0
                      fi
                      sleep "$POLL_INTERVAL_SECONDS"
                    done
                    # Drain did not complete within budget: proceed to termination regardless so
                    # the pod is never stuck beyond terminationGracePeriodSeconds. The listener's
                    # own bounded shutdown (acknowledgement-shutdown-timeout-seconds) and
                    # never-ack-unfinished-work guarantee remain the backstop for this case.
                    exit 0
          env:
          {{- if .Values.env }}
          {{- range .Values.env }}
          - name: {{ .name }}
            {{- if .value }}
            value: {{ tpl .value $ | quote }}
            {{- end }}
            {{- if .valueFrom }}
            valueFrom:
              {{- if .valueFrom.secretKeyRef }}
              secretKeyRef:
                name: {{ tpl .valueFrom.secretKeyRef.name $ | quote }}
                key: {{ .valueFrom.secretKeyRef.key }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{ if .Values.extraEnvVars }}
          {{- range .Values.extraEnvVars }}
          - name: {{ .name }}
            {{- if .value }}
            value: {{ tpl .value $ | quote }}
            {{- end }}
            {{- if .valueFrom }}
            valueFrom:
              {{- if .valueFrom.secretKeyRef }}
              secretKeyRef:
                name: {{ tpl .valueFrom.secretKeyRef.name $ | quote }}
                key: {{ .valueFrom.secretKeyRef.key }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{/*
            Define Sentry environment variables
          */}}
          {{- if .Values.sentry.enabled }}
          - name: SENTRY_ENABLED
            value: "true"
          - name: SENTRY_DSN
            valueFrom:
              secretKeyRef:
                name: laa-data-claims-event-service-secrets
                key: SENTRY_DSN
          - name: SENTRY_ENVIRONMENT
            value: {{ .Values.sentry.environment | quote }}
          - name: SENTRY_TRACES_SAMPLE_RATE
            value: {{ .Values.sentry.tracesSampleRate | quote }}
          {{- end }}
---
{{- if .Values.ingress }}
{{- if eq .Values.ingress.externalRoute.enabled true }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if hasKey .Values.ingress "whitelist" }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ include "laa.cidr-ranges.dynamic" . | quote }}
    {{- end }}
    {{- if and (hasKey .Values "stickiness") (eq .Values.stickiness.enabled true) }}
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    {{- end }}
    external-dns.alpha.kubernetes.io/set-identifier: {{ .Release.Name }}-{{ .Chart.Name }}-{{ .Release.Namespace }}-green
    external-dns.alpha.kubernetes.io/aws-weight: "100"
spec:
  ingressClassName: default
  tls:
    - hosts:
        - {{ .Release.Name }}-{{ .Chart.Name }}-{{ .Release.Namespace }}.{{ .Values.clusterDomain }}
    {{- if .Values.ingress.externalRoute.hostname }}
    {{- if eq .Values.ingress.externalRoute.hostname.enabled true }}
    - hosts:
        - {{ required "hostname value must be provided when hostname is enabled." .Values.ingress.externalRoute.hostname.value }}
      secretName: {{ required "hostname certSecretName must be provided when hostname is enabled." .Values.ingress.externalRoute.hostname.certSecretName }}
    {{- end }}
    {{- end }}
  rules:
    - host: {{ .Release.Name }}-{{ .Chart.Name }}-{{ .Release.Namespace }}.{{ .Values.clusterDomain }}
      http:
        paths:
            - path: /
              pathType: ImplementationSpecific
              backend:
                service:
                  name: {{ .Release.Name }}-{{ .Chart.Name }}-service
                  port:
                    number: 80
    {{- if .Values.ingress.externalRoute.hostname }}
    {{- if eq .Values.ingress.externalRoute.hostname.enabled true }}
    - host: {{ required "hostname value must be provided when hostname is enabled." .Values.ingress.externalRoute.hostname.value }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Release.Name }}-{{ .Chart.Name }}-service
                port:
                  number: 80
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-{{ .Chart.Name }}
    app: {{ .Release.Name }}-{{ .Chart.Name }}-service
spec:
  {{- if and (hasKey .Values "stickiness") (eq .Values.stickiness.enabled true) }}
  sessionAffinity: ClientIP
  {{- end }}
  ports:
    {{- if .Values.ports }}
    - protocol: {{ .Values.ports.protocol }}
      name: {{ .Chart.Name }}-https
      port: {{ .Values.ports.port }}
      targetPort: {{ .Values.ports.targetPort }}
    {{- end }}
    {{- if .Values.management.enabled }}
    - protocol: {{ .Values.management.protocol }}
      name: {{ .Chart.Name }}-management
      port: {{ .Values.management.port }}
      targetPort: {{ .Values.management.targetPort }}
    {{- end }}
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-{{ .Chart.Name }}
