name: Security Snyk container image check

on:
  workflow_dispatch:
  # GitHub Actions cron schedules always run in UTC, which is one hour behind
  # UK local time during British Summer Time. Runs may also start a few minutes
  # late when GitHub is under load.
  schedule:
    - cron: '0 6 * * 1-5' # 06:00 UTC, Monday to Friday
    - cron: '0 15 * * 1-5' # 15:00 UTC, Monday to Friday

jobs:
  image-scan:
    uses: ministryofjustice/laa-data-claims-api/.github/workflows/security-snyk-scan.yml@d7f5f57f61af4d54eec5a96aaf4cdeaa550ff892 # v1.34.1
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    with:
      image_prefix: ${{ vars.LAA_DATA_CLAIMS_EVENT_SERVICE_IMAGE_PREFIX }}
      jar_subproject: 'data-claims-event-service'
    secrets:
      gh_token: ${{ secrets.PHILS_PAT_TOKEN }}
      ecr_repository: ${{ vars.LAA_DATA_CLAIMS_EVENT_SERVICE_ECR_REPOSITORY }}
      ecr_region: ${{ vars.LAA_DATA_CLAIMS_EVENT_SERVICE_ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.LAA_DATA_CLAIMS_EVENT_SERVICE_ECR_ROLE_TO_ASSUME }}
      snyk_client_id: ${{ secrets.SNYK_CLIENT_ID }}
      snyk_client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}
      slack_webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
