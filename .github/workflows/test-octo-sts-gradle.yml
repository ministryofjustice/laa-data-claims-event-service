name: Test building validator from source

on:
  push:
    branches:
      - test/octo-sts-gradle

permissions:
  contents: read
  id-token: write

env:
  VALIDATOR_VERSION: v1.4.16

jobs:
  build-validator:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Checkout the consumer repository
      # ----------------------------------------------------------
      - name: Checkout claims event service
        uses: actions/checkout@v4
        with:
          path: claims-event-service

      # ----------------------------------------------------------
      # 2. Obtain short-lived access to the validator repository
      # ----------------------------------------------------------
      - name: Get validator token from Octo STS
        id: octo-sts
        uses: octo-sts/action@v1.1.1
        with:
          scope: ministryofjustice/laa-data-controlled-work-validator
          identity: gradle-package-test

      - name: Confirm Octo STS token
        env:
          OCTO_STS_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          if [ -z "$OCTO_STS_TOKEN" ]; then
            echo "Octo STS did not return a token"
            exit 1
          fi

          echo "SUCCESS: Octo STS returned a token"

      # ----------------------------------------------------------
      # 3. Checkout the EXACT validator version requested above
      # ----------------------------------------------------------
      - name: Checkout validator
        uses: actions/checkout@v4
        with:
          repository: ministryofjustice/laa-data-controlled-work-validator
          ref: ${{ env.VALIDATOR_VERSION }}
          token: ${{ steps.octo-sts.outputs.token }}
          path: validator

      # ----------------------------------------------------------
      # 4. Show exactly what was checked out
      # ----------------------------------------------------------
      - name: Verify validator checkout
        working-directory: validator
        run: |
          echo "Requested version: $VALIDATOR_VERSION"
          echo "Checked out commit:"
          git rev-parse HEAD

          echo "Git description:"
          git describe --tags --always

      # ----------------------------------------------------------
      # 5. Set up Java
      # ----------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: "25"

      # ----------------------------------------------------------
      # 6. Make sure the Gradle wrapper is executable
      # ----------------------------------------------------------
      - name: Configure Gradle wrapper
        working-directory: validator
        run: chmod +x gradlew

      # ----------------------------------------------------------
      # 7. Build claims-validation-core directly from source
      # ----------------------------------------------------------
      - name: Build claims-validation-core
        working-directory: validator
        run: |
          ./gradlew :claims-validation-core:build --no-daemon

      # ----------------------------------------------------------
      # 8. Show us what Gradle produced
      # ----------------------------------------------------------
      - name: Show built artifacts
        run: |
          echo "Built validator artifacts:"
          find validator/claims-validation-core/build/libs \
            -maxdepth 1 \
            -type f \
            -print