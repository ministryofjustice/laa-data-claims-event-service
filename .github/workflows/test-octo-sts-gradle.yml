name: Test Octo STS Gradle access

on:
  push:
    branches:
      - test/octo-sts-gradle

permissions:
  contents: read
  id-token: write

jobs:
  test-package-access:
    runs-on: ubuntu-latest

    steps:
      - name: Get token from Octo STS
        id: octo-sts
        uses: octo-sts/action@v1.1.1
        with:
          scope: ministryofjustice/laa-data-controlled-work-validator
          identity: gradle-package-test

      - name: Confirm Octo STS token was returned
        env:
          OCTO_STS_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          if [ -z "$OCTO_STS_TOKEN" ]; then
            echo "Octo STS did not return a token"
            exit 1
          fi

          echo "SUCCESS: Octo STS returned a token"

      # We expect this test may return HTTP 401.
      # continue-on-error allows the PAT control test to run afterwards.
      - name: Test package with Octo STS token
        continue-on-error: true
        env:
          OCTO_STS_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          curl --fail-with-body \
            --user "${{ github.actor }}:${OCTO_STS_TOKEN}" \
            --location \
            --verbose \
            --output /tmp/octo-sts.pom \
            "https://maven.pkg.github.com/ministryofjustice/laa-data-controlled-work-validator/uk/gov/justice/laa/dstew/payments/claims/validation/claims-validation-core/1.4.16/claims-validation-core-1.4.16.pom"

          echo "SUCCESS: Octo STS token downloaded the package"

      # Control test using the PAT.
      # PHILS_PAT_TOKEN should be stored as a GitHub Actions secret.
      - name: Test package with PAT
        env:
          PAT_TOKEN: ${{ secrets.PHILS_PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "PHILS_PAT_TOKEN was not available"
            exit 1
          fi

          curl --fail-with-body \
            --user "${{ github.actor }}:${PAT_TOKEN}" \
            --location \
            --verbose \
            --output /tmp/pat.pom \
            "https://maven.pkg.github.com/ministryofjustice/laa-data-controlled-work-validator/uk/gov/justice/laa/dstew/payments/claims/validation/claims-validation-core/1.4.16/claims-validation-core-1.4.16.pom"

          echo "SUCCESS: PAT downloaded the package"

      - name: Show downloaded POM
        run: |
          echo "Downloaded POM:"
          head -20 /tmp/pat.pom