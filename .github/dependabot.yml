# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

# Uncomment 'registries' section to receive dependabot updates for 'laa-spring-boot-common'.
# Ensure the credential used by Dependabot can download the packages: a classic PAT
# requires read:packages, and access to any private repository that owns a package.
# The token must also be authorized with (MoJ) SSO. See link below for guidance:
# https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens#creating-a-personal-access-token-classic
registries:
  spring-boot-common-github-packages:
    type: maven-repository
    url: https://maven.pkg.github.com/ministryofjustice/laa-spring-boot-common
    username: ${{ github.actor }}
    password: ${{ secrets.PHILS_PAT_TOKEN }}
  data-claims-api-github-packages:
    type: maven-repository
    url: https://maven.pkg.github.com/ministryofjustice/laa-data-claims-api
    username: ${{ github.actor }}
    password: ${{ secrets.PHILS_PAT_TOKEN }}
  data-provider-github-packages:
    type: maven-repository
    url: https://maven.pkg.github.com/ministryofjustice/laa-data-provider-data
    username: ${{ github.actor }}
    password: ${{ secrets.PHILS_PAT_TOKEN }}
  laa-data-controlled-work-validator-github-packages:
    type: maven-repository
    url: https://maven.pkg.github.com/ministryofjustice/laa-data-controlled-work-validator
    username: ${{ github.actor }}
    password: ${{ secrets.PHILS_PAT_TOKEN }}

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: wednesday
      time: "06:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    registries: "*"
    groups:
      gradle-updates:
        exclude-patterns:
          - "uk.gov.justice.*"
          - "uk.gov.laa.*"
      internal-packages:
        patterns:
          - "uk.gov.justice.*"
          - "uk.gov.laa.*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: wednesday
      time: "07:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "**"
